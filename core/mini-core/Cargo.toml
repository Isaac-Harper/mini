[package]
name = "mini-core"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
name = "mini_core"
crate-type = ["staticlib"]

[dependencies]
cef = { workspace = true, features = ["sandbox"] }
objc2 = "0.6.3"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSResponder", "NSView"] }
adblock = { version = "0.13.3", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
psl = "2.1.245"
ureq = "3"
url = "2"
serde_json = "1"
early-errors = { path = "../early-errors" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
zeroize = "1"
